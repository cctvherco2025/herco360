*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
#app{display:grid;height:100vh;height:100dvh;grid-template-rows:auto 1fr 44dvh;grid-template-columns:minmax(0,1fr)}

h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{font-size:11.5px;color:var(--mut)}

.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
#stage{position:relative;min-height:0;overflow:hidden}
#stage>canvas{display:block;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(29,36,48,.8);color:#fff;font-size:11.5px;padding:6px 12px;border-radius:20px;pointer-events:none;white-space:nowrap;transition:opacity .4s}
.layers{position:absolute;left:8px;top:8px;right:112px;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}

#walkb svg,#fullb svg{width:14px;height:14px}

#wcart{position:absolute;right:8px;top:8px;z-index:6;background:#d23b3b}

#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:#1d2430;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#joy span{position:absolute;left:0;right:0;top:-20px;text-align:center;font:600 10.5px Inter;color:#1d2430;text-shadow:0 0 4px #fff}

#wcard .act{display:flex;gap:8px;margin-top:10px}

#wtoast{position:absolute;left:50%;top:52px;transform:translateX(-50%);background:rgba(29,36,48,.9);color:#fff;font-size:12.5px;padding:8px 14px;border-radius:12px;max-width:calc(100% - 24px);text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;z-index:7;line-height:1.4}

.kpi{background:#f6f7f9;border-radius:10px;padding:8px 9px}

.kpi span{font-size:10.5px;color:var(--mut)}
.tabs{display:flex;gap:16px;border-bottom:1px solid var(--line);margin-bottom:10px}

.bar{height:7px;background:#eef0f3;border-radius:5px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.over{color:#c62828!important;font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.ph{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.ph i{width:38px;height:38px;border-radius:10px;flex:none}
.ph b{display:block;font-size:15px;line-height:1.25}
.ph span{font-size:12px;color:var(--mut)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.fact span{display:block;font-size:10.5px;color:var(--mut);margin-bottom:2px}
.fact b{font-size:13.5px;font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:8px}

.warn{margin-top:10px;background:#fdecea;color:#b71c1c;font-size:12px;padding:8px 10px;border-radius:8px}
.note{margin-top:12px;font-size:11.5px;color:var(--mut);line-height:1.5}

.btn{border:0;background:var(--ink);color:#fff;border-radius:9px;padding:8px 12px;font:600 12.5px Inter;cursor:pointer;margin-top:10px}
.back{border:0;background:none;color:var(--acc);font:600 12.5px Inter;padding:0;margin-bottom:10px;cursor:pointer}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:22px 10px;line-height:1.5}

{

  // [x0,y0,x1,y1, normal hacia afuera, nombre]
  const COTAS=[
    [XO,0,XE,0,[0,-1],'Fachada'],
    [XE,0,XE,YN2,[1,0],'Pared este'],

    const m=new THREE.Mesh(new THREE.BoxGeometry(len,.012,w),cm);m.position.set((x0+x1)/2,HY,-(y0+y1)/2);m.rotation.y=Math.atan2(dy,dx);L.cotas.add(m);};

    raya(x1+nx*.05,y1+ny*.05,x1+nx*(OFF+EXT),y1+ny*(OFF+EXT),.025);

  if(k==='p'){const p=PRODS.find(p=>p.id===id);return p._obj?new THREE.Box3().setFromObject(p._obj):p._bb;}
  if(k==='c')return new THREE.Box3().setFromObject(CAMS.find(c=>c[0]===id).obj);
  if(k==='a')return new THREE.Box3().setFromObject(ACS.find(a=>a[0]===id).obj);

  const objs=[];scene.traverse(o=>{if(o.userData.sel===s&&o.isMesh)objs.push(o);});if(!objs.length)return null;

  const p=PRODS.find(q=>q.id===s.slice(2));if(!p)return;
  if(!p.pr){toast('Eso es inventario de bodega, no está a la venta en piso.');return;}
  if(dist>3.0){toast(`Acérquese para tomarlo (está a ${dist.toFixed(1)} m).`);return;}
  showTake(p,hit.object.isInstancedMesh?{grp:hit.object.userData.grp,i:hit.instanceId}:null);
}
const isAvatar=o=>{for(;o;o=o.parent)if(o===avatar)return true;return false;};
const card=document.getElementById('wcard');
function hideCard(){card.style.display='none';card.classList.remove('side');}
function showTake(p,iid){
  const big=p.t==='m'||p.t==='l';

   <div style="font-size:20px;font-weight:800;margin-top:6px">${money(p.pr)}</div>${big?'<div style="font-size:12px;color:var(--mut);margin-top:2px">Producto grande: un asesor se lo lleva a caja desde bodega.</div>':''}

}
/* vendedor: indicaciones exactas según el planograma */
function whereIs(f){
  const gm=f.zone.match(/^Góndola (\d)$/);
  if(gm){const n=+gm[1],side=f.face==='N'?(n===1?'el pasillo entre la pared del fondo y la Góndola 1':`el pasillo entre la Góndola ${n-1} y la Góndola ${n}`):
      f.face==='S'?(n===4?'el pasillo de enfrente, entre la Góndola 4 y la entrada':`el pasillo entre la Góndola ${n} y la Góndola ${n+1}`):
      f.face==='E'?'la cabecera que da al pasillo central':'la cabecera que da a la pared izquierda';
    return `Góndola ${n}, ${f.face==='N'||f.face==='S'?(f.kind==='peg'?'en ganchos':'en repisas')+', en '+side:'en '+side}`;}
  const extra={W1:'al frente, cerca de la entrada',W2:'entre el módulo 1 y el 3',W3:'a media pared',W4:'al fondo',N1:'a la izquierda',N2:'al centro',E1:'',E2:'pasando las cajas',E3:'a media tienda',E4:'frente a la tarima de sierras',E5:'cerca de la bodega',L1:'junto a la escalera del mezzanine, a la izquierda de la isla de generadores',B1:'',B2:'',B3:'',
    T1:'en el pasillo central, frente a la Góndola 1',T2:'en el pasillo central, frente a la Góndola 2',V1:'en el pasillo central, a la altura de la Góndola 3',M1:'al fondo del pasillo central, antes de la bodega',
    BM:'al fondo, en el área de bodega',C0:'junto a la Caja 1'}[f.id]||'';
  const nm=f.id==='L1'?'Pared de la escalera':f.name.replace(' · ',', ');
  return nm+(extra?', '+extra:'');
}
const ASK=[['Taladros y atornilladores',/^(taladro|atornillador|llave de impacto|combo atornillador)/i],['Esmeriladoras',/^(esmeril|mini esmeril|combo esmeril)/i],['Rotomartillos',/^rotomartillo/i],
  ['Sierras, discos y hojas',/sierra(?!.*bimet)|caladora|ingleteadora|ranuradora|disco de sierra|hojas? (para caladora|sierra)/i],['Motosierras y podadoras',/^(motosierra|podadora|espada|cadena)/i],
  ['Generadores',/^generador/i],['Compresores de aire',/^(compresor|combo 5 accesorios para compresor|manguera espiral)/i],
  ['Hidrolavadoras',/^(hidrolavadora|boquilla|cepillo para limpieza de rines|destapador|pistola con lanza|manguera alta presión|dispensador de shampoo)/i],['Bombas de agua',/^(bomba|caja de control bomba)/i],['Baterías y cargadores',/^(batería|cargador|combo( 2)? bater)/i],
  ['Llaves, desarmadores y martillos',null,['manual','sets']],['Brocas y brocas sierra',/broca|mandril|extractor/i],['Discos de corte y diamantados',/disco (diamantado|de corte|flap|de desbaste)|discos de corte/i],
  ['Niveles y medición',/^(nivel|medidor|cinta métrica|multímetro|pinza amper|detector)|^escuadra$/i],['Seguridad y candados',null,['seg']],['Albañilería y tablayeso',null,['alba']],
  ['Material eléctrico y linternas',null,['electr']],['Jardinería',null,['jard']],['Engrapadoras y pintura',null,['pint']]];
let guideMark=null;
const norm=t=>(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9.½¼¾"]+/g,' ').trim();
function guide(first){
  W.wave=first?3.2:1.6;
  card.innerHTML=`<b>Vendedor(a) · INGCO-STORE</b><div style="line-height:1.45;margin-bottom:8px">${first?'¡Buenos días! Bienvenido a INGCO-STORE. Soy su asesor de ventas.':'Con gusto le ayudo.'} ¿Qué producto busca? Escríbame el nombre o el código y le digo dónde está.</div>
   <input id="vsearch" type="search" placeholder="Ej.: esmeriladora 4½, UAG75028, nivel 80 cm…" autocomplete="off"
     style="width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:500 14px Inter;margin-bottom:8px">
   <div id="vres"></div>
   <div style="font-size:11.5px;color:var(--mut);margin:6px 0 4px">O elija una categoría:</div>

}
function slotTxt(p){const f=fxById(p.fx);if(p.t==='m')return'Piso de exhibición';if(p.t==='l')return'Exhibidor de escaleras';const sl=f.slots&&f.slots[p.slot];if(!sl)return'';
  const z=(p.vm||'').split(' · ')[0].toLowerCase();return `${sl.peg?'en gancho':'en repisa'} a ${sl.y.toFixed(2)} m${z?' ('+z+')':''}`;}
function searchProd(q){
  const box=document.getElementById('vres');if(!box)return;const t=norm(q);if(t.length<2){box.innerHTML='';return;}
  const words=t.split(' ');const groups=new Map();
  PRODS.filter(p=>p.pr).forEach(p=>{const hay=norm(p.n+' '+(p.code||'')+' '+(p.sub||'')+' '+CAT[p.cat][0]);if(words.every(w=>hay.includes(w))){const k=p.code||p.n+'|'+p.sub;groups.set(k,(groups.get(k)||[]).concat(p));}});
  const ag=AGOTADOS.filter(a=>words.every(w=>norm(a[0]+' '+a[1]).includes(w)));
  if(!groups.size&&!ag.length){box.innerHTML=`<div style="font-size:13px;color:var(--mut)">No tenemos ese producto en piso. Pruebe con otra palabra o el código INGCO.</div>`;return;}
  const list=[...groups.values()].slice(0,6);
  box.innerHTML=list.map((ps,i)=>{const p=ps[0];return `<div class="ln" style="cursor:pointer;align-items:flex-start" data-w="loc" data-k="${encodeURIComponent(p.code||p.n+'|'+p.sub)}">
     <span style="flex:1"><b style="font-size:13px;display:inline">${p.n}</b>${p.code?` <span style="color:var(--mut);font-size:11.5px">${p.code}</span>`:''}<br><span style="font-size:12px;color:var(--mut)">${whereIs(fxById(p.fx))}${ps.length>1?` · y ${ps.length-1} lugar${ps.length>2?'es':''} más`:''}</span></span>
     <span style="font-weight:700;white-space:nowrap">${money(p.pr)}</span></div>`;}).join('')
   +(groups.size>6?`<div style="font-size:12px;color:var(--mut);margin-top:4px">${groups.size-6} resultados más; escriba más detalle.</div>`:'')
   +ag.slice(0,3).map(a=>`<div class="ln"><span style="flex:1;font-size:12.5px">${a[0]} <span style="color:var(--mut)">${a[1]}</span></span><span style="color:#c62828;font-size:12px;font-weight:700">Agotado</span></div>`).join('');
}
function locate(key){
  const k=decodeURIComponent(key),ps=PRODS.filter(p=>p.pr&&((p.code||p.n+'|'+p.sub)===k));if(!ps.length)return;const p=ps[0];
  W.wave=1.2;
  card.innerHTML=`<b>Vendedor(a)</b><div style="line-height:1.45"><b>${p.n}</b>${p.code?` · INGCO ${p.code}`:''} — ${money(p.pr)}.<br>Lo encuentra en:
   <ul style="margin:6px 0 0 18px;padding:0">${ps.slice(0,4).map(q=>`<li>${whereIs(fxById(q.fx))}, ${slotTxt(q)}</li>`).join('')}</ul>
   <div style="margin-top:6px;color:var(--mut);font-size:12px">Le marqué ${ps.length>1?'los lugares':'el lugar'} con una flecha verde; también aparece${ps.length>1?'n':''} en el minimapa.</div></div>
   <div class="act"><button class="sec2" data-w="guide">Buscar otro</button><button class="pri" data-w="close">Gracias</button></div>`;card.classList.add('side');
  if(guideMark)guideMark.forEach(m=>scene.remove(m));
  guideMark=ps.slice(0,4).map(q=>{const bb=q._obj?new THREE.Box3().setFromObject(q._obj):q._bb;const c=bb.getCenter(new V3());
    const g=new THREE.Mesh(new THREE.ConeGeometry(.12,.3,16),new THREE.MeshBasicMaterial({color:'#2ee07a'}));g.rotation.x=Math.PI;g.position.set(c.x,bb.max.y+.35,c.z);g.userData.bob=g.position.y;scene.add(g);return g;});
}
function answer(i){
  const[label,re,cats]=ASK[i];
  const hits=PRODS.filter(p=>p.pr&&(re?re.test(p.n):cats.includes(p.cat)));
  const by=new Map();hits.forEach(p=>{const k=p.fx;by.set(k,(by.get(k)||[]).concat(p));});
  const rows=[...by.entries()].sort((a,b)=>b[1].length-a[1].length);
  const names=new Set(hits.map(p=>p.code||p.n));
  const lines=rows.slice(0,4).map(([fid,ps])=>`<li>${whereIs(fxById(fid))} <span style="color:var(--mut)">(${ps.length})</span></li>`).join('');
  const more=rows.length>4?`<div style="color:var(--mut);font-size:12px;margin-top:4px">y ${rows.length-4} lugar${rows.length-4>1?'es':''} más con pocas unidades.</div>`:'';
  const cheap=hits.slice().sort((a,b)=>a.pr-b.pr)[0],top=hits.slice().sort((a,b)=>b.pr-a.pr)[0];
  card.innerHTML=`<b>Vendedor(a)</b><div style="line-height:1.45">${label}: tenemos ${names.size} modelo${names.size>1?'s':''}${cheap?`, desde ${money(cheap.pr)}${top!==cheap?` hasta ${money(top.pr)}`:''}`:''}. Los encuentra en:
   <ul style="margin:6px 0 0 18px;padding:0">${lines}</ul>${more}
   <div style="margin-top:6px;color:var(--mut);font-size:12px">Le marqué ${rows.length>1?'los lugares':'el lugar'} con una flecha verde.</div></div>
   <div class="act"><button class="sec2" data-w="guide">Otra cosa</button><button class="pri" data-w="close">Gracias</button></div>`;card.style.display='block';
  if(guideMark)guideMark.forEach(m=>scene.remove(m));
  guideMark=rows.slice(0,4).map(([fid,ps])=>{const f=fxById(fid),b=new THREE.Box3();ps.forEach(p=>{const bb=p._obj?new THREE.Box3().setFromObject(p._obj):p._bb;if(bb)b.union(bb);});const c=b.getCenter(new V3());
    const g=new THREE.Mesh(new THREE.ConeGeometry(.14,.36,16),new THREE.MeshBasicMaterial({color:'#2ee07a'}));g.rotation.x=Math.PI;g.position.set(c.x,Math.max(b.max.y,(f.base||0)+1.2)+.45,c.z);g.userData.bob=g.position.y;scene.add(g);return g;});
}
function talk(who,txt){card.innerHTML=`<b>${who}</b><div style="line-height:1.45">${txt}</div><div class="act"><button class="pri" data-w="close">Gracias</button></div>`;card.style.display='block';}
const cartTotal=()=>[...W.cart.values()].reduce((a,c)=>a+c.q*c.p.pr,0);
function updateCart(){const n=[...W.cart.values()].reduce((a,c)=>a+c.q,0);document.getElementById('wcart').textContent=`Canasta · ${n}${n?' · '+moneyK(cartTotal()):''}`;
  if(avatar&&avatar.userData.basket){const bk=avatar.userData.basket;bk.children.filter(o=>o.userData.item).forEach(o=>bk.remove(o));
    [...W.cart.values()].slice(0,6).forEach((c,i)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(.08,.07,.06),std(CAT[c.p.cat][1]));m.position.set(-.11+(i%3)*.11,.03,(i<3?-.04:.05));m.userData.item=1;bk.add(m);});}}
function openCart(){
  if(!W.cart.size){card.innerHTML=`<b>Su canasta está vacía</b><div>Toque un producto en los estantes para tomarlo.</div><div class="act"><button class="pri" data-w="close">Seguir comprando</button></div>`;card.style.display='block';return;}
  card.innerHTML=`<b>Su canasta</b>${[...W.cart.values()].map(c=>`<div class="ln"><span style="flex:1">${c.q} × ${c.p.n} ${c.p.sub}</span><span>${money(c.q*c.p.pr)}</span><button data-w="minus" data-id="${c.p.id}">−</button></div>`).join('')}
   <div class="ln" style="border:0;font-weight:800;font-size:15px"><span>Total</span><span>${money(cartTotal())}</span></div>
   <div class="act"><button class="sec2" data-w="close">Seguir comprando</button><button class="pri" data-w="pay">Pagar</button></div>`;card.style.display='block';}
function pay(){
  const near=W.h<1&&W.x>10.6&&W.x<11.75&&W.y>.8&&W.y<3.4;
  if(!near){toast('Para pagar, camine hasta una de las cajas (a la derecha de la entrada) y toque “Pagar” ahí.',3800);hideCard();return;}
  const items=[...W.cart.values()];

   <div style="margin-top:8px">${items.map(c=>`<div class="ln"><span style="flex:1">${c.q} × ${c.p.n} ${c.p.sub}</span><span>${money(c.q*c.p.pr)}</span></div>`).join('')}</div>
   <div class="ln" style="border:0;font-weight:800;font-size:15px"><span>Total pagado</span><span>${money(cartTotal())}</span></div>
   <div style="text-align:center;margin-top:6px;color:#14806b;font-weight:700">¡Gracias por su compra!</div><div class="act"><button class="pri" data-w="close">Listo</button></div>`;

card.addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(!b)return;const w=b.dataset.w;if(w==='ask'){answer(+b.dataset.i);return;}if(w==='guide'){guide();return;}if(w==='loc'){locate(b.dataset.k);return;}
  if(w==='close')hideCard();else if(w==='take')card._take&&card._take();else if(w==='pay')pay();
  else if(w==='minus'){const c=W.cart.get(b.dataset.id);c.q--;if(c.q<=0)W.cart.delete(b.dataset.id);updateCart();openCart();}});

let toastT=null;function toast(t,ms=2600){const el=document.getElementById('wtoast');el.textContent=t;el.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>el.style.opacity=0,ms);}
/* minimapa */
const mm=document.getElementById('mmap'),mx=mm.getContext('2d'),MS=8.4;
function drawMap(){const w=mm.width,h=mm.height,X=x=>2+x*MS,Y=y=>h-2-y*MS;
  mx.clearRect(0,0,w,h);mx.fillStyle='rgba(255,255,255,.93)';mx.fillRect(0,0,w,h);
  mx.fillStyle='#ece9e3';mx.beginPath();[[0,0],[14.16,0],[14.16,21.65],[8.44,21.65],[8.44,11.44],[0,11.44]].forEach(([x,y],i)=>i?mx.lineTo(X(x),Y(y)):mx.moveTo(X(x),Y(y)));mx.closePath();mx.fill();mx.strokeStyle='#8f98a3';mx.lineWidth=1.5;mx.stroke();
  FX.filter(f=>!f.base).forEach(f=>{const[x0,y0,x1,y1]=f.rect;mx.fillStyle=f.cat?CAT[f.cat][1]:'#a7afb8';mx.fillRect(X(x0),Y(y1),(x1-x0)*MS,(y1-y0)*MS);});
  mx.fillStyle='#2b3038';mx.fillRect(X(11.7),Y(3.09),.73*MS,2.04*MS);mx.fillStyle='#8f98a3';mx.fillRect(X(8.7),Y(20.45),1.1*MS,4.1*MS);
  mx.setLineDash([3,2]);mx.strokeStyle='#5d6b7a';mx.lineWidth=1;mx.strokeRect(X(8.44),Y(21.65),5.72*MS,5.5*MS);mx.setLineDash([]);
  mx.fillStyle='#14806b';mx.fillRect(X(9.45),Y(0)-2,2*MS,3);
  STAFF.forEach(s=>{mx.fillStyle='#f07a1a';mx.beginPath();mx.arc(X(s[2]),Y(s[3]),2.6,0,7);mx.fill();});
  if(guideMark)guideMark.forEach(m=>{mx.fillStyle='#2ee07a';mx.strokeStyle='#0b7a3b';mx.lineWidth=1.5;mx.beginPath();mx.arc(X(m.position.x),Y(-m.position.z),4.5,0,7);mx.fill();mx.stroke();});
  mx.save();mx.translate(X(W.x),Y(W.y));mx.rotate(-W.yaw);mx.fillStyle=W.h>1.5?'#8e4ec6':'#1f6feb';mx.beginPath();mx.moveTo(0,-7);mx.lineTo(4.5,5);mx.lineTo(0,2.5);mx.lineTo(-4.5,5);mx.closePath();mx.fill();mx.restore();
  if(W.h>1.5){mx.fillStyle='#8e4ec6';mx.font='700 9px Inter';mx.fillText('MEZZANINE',4,11);}
}

/* =================== LOOP =================== */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);
let lastT=performance.now(),frame=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(guideMark)guideMark.forEach(m=>{m.position.y=m.userData.bob+Math.sin(now/250)*.08;m.rotation.y+=dt*2;});
  if(W.on){updateWalk(dt);if((frame++&1)===0)drawMap();renderer.render(scene,camera);return;}
  if(tw){const k=Math.min(1,(now-tw.t0)/850),e=1-Math.pow(1-k,3);camera.position.lerpVectors(tw.fp,tw.tp,e);controls.target.lerpVectors(tw.ft,tw.tt,e);camera.fov=tw.f0+(tw.f1-tw.f0)*e;camera.updateProjectionMatrix();if(k>=1)tw=null;}
  controls.update();renderer.render(scene,camera);}
(async()=>{
  try{await Promise.race([document.fonts.load('800 64px Inter'),new Promise(r=>setTimeout(r,1500))]);}catch(e){}
  FX.forEach(initFixture);buildStatic();buildAll();applyLayers();renderPanel();resize();
  const[p,t]=VIEWS.general;const a=stage.clientWidth/stage.clientHeight;let pp=new V3(...p),tt=new V3(...t);if(a<1)pp=tt.clone().add(pp.clone().sub(tt).multiplyScalar(Math.min(1.9,1.1/a)));
  camera.position.copy(pp);controls.target.copy(tt);window.__ok=true;
  requestAnimationFrame(loop);
  // HERCO OPS puede pedir abrir en una vista: window.__VISTA = 'planta' | 'pasillo' | … | 'cliente'
  const pedida=window.__VISTA;
  if(pedida==='cliente')setTimeout(enterWalk,350);
  else if(pedida&&pedida!=='general'&&document.querySelector(`#views button[data-v="${pedida}"]`))setTimeout(()=>goView(pedida),350);
})();
